name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "apps/codex-plus-manager/src/**"
      - "apps/codex-plus-manager/web-preview/**"
      - "apps/codex-plus-manager/package.json"
      - "apps/codex-plus-manager/package-lock.json"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/codex-plus-manager/package-lock.json

      - name: Build manager web preview
        working-directory: apps/codex-plus-manager
        run: |
          npm ci
          npm run vite:build -- --config web-preview/vite.config.ts

      - name: Refresh site data
        run: node site/scripts/build-data.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
